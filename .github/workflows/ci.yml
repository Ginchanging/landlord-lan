name: Build and test

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Test and build Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install pinned Flutter
        run: |
          git clone --depth 1 --branch 3.41.9 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Dependencies
        run: |
          flutter config --no-analytics
          flutter pub get --enforce-lockfile
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test --reporter expanded
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  ios:
    name: Compile iOS without signing
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Flutter
        run: |
          git clone --depth 1 --branch 3.41.9 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Dependencies
        run: |
          flutter config --no-analytics
          flutter pub get --enforce-lockfile
          flutter precache --ios
      - run: flutter build ios --release --no-codesign

  windows:
    name: Build and launch Windows
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Flutter
        shell: pwsh
        run: |
          git clone --depth 1 --branch 3.41.9 https://github.com/flutter/flutter.git "$env:RUNNER_TEMP/flutter"
          "$env:RUNNER_TEMP/flutter/bin" >> $env:GITHUB_PATH
      - name: Dependencies
        run: |
          flutter config --no-analytics --enable-windows-desktop
          flutter pub get --enforce-lockfile
      - run: flutter test --reporter expanded
      - run: flutter build windows --release
      - name: Package portable app with C++ runtimes
        run: ./.github/scripts/package-windows.ps1
      - name: Launch packaged Windows app
        run: ./.github/scripts/smoke-windows.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-smoke
          path: smoke/
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: dist/*-windows-x64.zip
          if-no-files-found: error

  release:
    name: Publish tested release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, ios, windows]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: windows-x64
          path: dist
      - name: Package source and build records
        run: |
          mv dist/app-release.apk "dist/landlord-lan-${RELEASE_TAG}-android.apk"
          git archive --format=zip --prefix=landlord-lan/ --output="dist/landlord-lan-${RELEASE_TAG}-source.zip" HEAD
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          folder = Path('dist')
          tag = os.environ['RELEASE_TAG']
          files = sorted(folder.glob('*.apk')) + sorted(folder.glob('*.zip'))
          checks = [f'{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.name}' for p in files]
          (folder / f'landlord-lan-{tag}-SHA256SUMS.txt').write_text('\n'.join(checks) + '\n')
          info = {
              'tag': tag, 'source_commit': os.environ['GITHUB_SHA'],
              'repository': os.environ['GITHUB_REPOSITORY'],
              'workflow_run': os.environ['GITHUB_RUN_ID'],
              'flutter': '3.41.9', 'dart': '3.11.5',
              'android_min_api': 24, 'android_target_api': 36,
              'apk_signing': 'Android debug/test key (GitHub Actions runner)',
              'automated_tests_passed': 42,
              'ios_build': 'Release compilation passed without code signing',
              'windows_build': 'x64 Release built, portable ZIP launched and exited normally',
              'windows_min_version': 'Windows 10 1903 / build 18362',
              'windows_signing': 'unsigned portable app',
              'physical_device_tests': 'not run',
          }
          (folder / f'landlord-lan-{tag}-BUILD-INFO.json').write_text(json.dumps(info, indent=2) + '\n')
          PY
      - name: Upload assets and publish prerelease
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --title "Landlord LAN ${RELEASE_TAG}" --notes-file docs/RELEASE_NOTES.md --prerelease
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --prerelease --title "Landlord LAN ${RELEASE_TAG}" --notes-file docs/RELEASE_NOTES.md
          fi
          gh release upload "$RELEASE_TAG" dist/* --clobber
          gh release edit "$RELEASE_TAG" --draft=false --prerelease
